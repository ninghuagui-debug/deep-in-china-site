<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3e"/>
      <stop offset="1" stop-color="#1b6b60"/>
    </linearGradient>
    <linearGradient id="mountFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="mountNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- 远山 -->
  <path d="M0 560 L150 440 L300 545 L470 405 L640 525 L800 430 L800 800 L0 800 Z" fill="url(#mountFar)"/>
  <!-- 近山 -->
  <path d="M0 650 L210 525 L400 625 L600 500 L800 605 L800 800 L0 800 Z" fill="url(#mountNear)"/>

  <!-- 主字母 D -->
  <text x="400" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="430" font-weight="700" fill="#f4f7f6" text-anchor="middle" dominant-baseline="central">D</text>

  <!-- 中国红印章 -->
  <circle cx="648" cy="182" r="60" fill="#C8102E"/>
  <text x="648" y="184" font-family="STKaiti, KaiTi, 'Times New Roman', serif" font-size="58" fill="#ffffff" text-anchor="middle" dominant-baseline="central">中</text>
</svg>
